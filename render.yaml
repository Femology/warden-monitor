# Render Blueprint for the warden-monitor indexer.
# Verified against Render's current Blueprint spec (services[].disk, rootDir
# for monorepo scoping, runtime replacing the deprecated env field) --
# https://render.com/docs/blueprint-spec -- not assumed from an older config
# shape.
#
# Deploy: connect this repo in the Render dashboard and it will detect this
# file automatically ("New +" -> "Blueprint"). Every envVar below marked
# `sync: false` is prompted for at that point, using the real values from
# this project's DEPLOYMENT-INFO.md -- none of them are committed here.

services:
  - type: web
    name: warden-monitor-indexer
    runtime: node
    # Free tier: no persistent disk (Render requires a paid plan for one).
    # SQLite lives on the ephemeral filesystem instead, so the indexed
    # history resets on every redeploy/restart -- acceptable for a demo
    # deployment. Switch back to `plan: starter` plus a `disk:` block (see
    # git history) once real persistence is worth paying for.
    plan: free
    region: oregon
    rootDir: indexer
    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      # Ephemeral path -- wiped on every redeploy/restart along with the
      # rest of the filesystem. Not a secret.
      - key: DB_PATH
        value: ./warden-monitor.db

      # Operational tunable, safe to commit -- not contract-identifying.
      - key: WARDEN_POLL_INTERVAL_MS
        value: "10000"

      # Contract-identifying values -- never hardcoded here. Render prompts
      # for each during Blueprint creation; fill in from DEPLOYMENT-INFO.md.
      - key: WARDEN_CONTRACT_ID
        sync: false
      - key: WARDEN_RPC_URL
        sync: false
      - key: WARDEN_NETWORK_PASSPHRASE
        sync: false
      - key: WARDEN_DEPLOY_LEDGER
        sync: false

    # Render injects PORT automatically for every web service -- do not
    # declare it here. indexer/src/config.ts already reads process.env.PORT.
