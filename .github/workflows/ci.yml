name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ensure warden-sdk is built
        run: |
          # npm's hoisting decision for this git dependency isn't stable --
          # it lands at the workspace root some installs and nested under
          # dashboard/node_modules others, with the same package.json/
          # lockfile, on the same npm version. Resolve its actual location
          # instead of assuming the root, or this step silently no-ops on a
          # nested install (nothing there to build) while the root path it
          # checked was never real to begin with.
          WARDEN_SDK_DIR=$(find . -maxdepth 4 -type d -name warden-sdk -path '*/node_modules/warden-sdk' | grep -v '/node_modules/.*/node_modules/' | head -1)
          if [ -z "$WARDEN_SDK_DIR" ]; then
            echo "::error::warden-sdk not found in node_modules anywhere in the workspace after npm ci"
            exit 1
          fi
          if [ ! -f "$WARDEN_SDK_DIR/dist/index.js" ]; then
            (cd "$WARDEN_SDK_DIR" && npx tsc)
          fi

      - name: indexer tests
        working-directory: indexer
        run: npm test

      - name: dashboard tests
        working-directory: dashboard
        run: npm test

      - name: indexer build
        working-directory: indexer
        run: npm run build

      - name: dashboard build
        working-directory: dashboard
        run: npm run build
